services:
  postgres:
    image: postgres:16-alpine
    container_name: llf_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-llf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llf_password}
      POSTGRES_DB: ${POSTGRES_DB:-laguisoft_lead_finder}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llf_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llf_network

  redis:
    image: redis:7-alpine
    container_name: llf_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-llf_redis_password}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-llf_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llf_network

  n8n:
    image: n8nio/n8n:latest
    container_name: llf_n8n
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      NODE_ENV: ${NODE_ENV:-development}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-laguisoft_lead_finder}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-llf_user}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-llf_password}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-change_me}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change_me_encryption_key}
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/home/node/.n8n/workflows
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - llf_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llf_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./config:/usr/src/app/config:ro
      - ./prompts:/usr/src/app/prompts:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - llf_network

volumes:
  postgres_data:
  redis_data:
  n8n_data:

networks:
  llf_network:
    driver: bridge
